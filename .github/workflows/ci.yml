name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore
        run: dotnet restore VkoInternetMonitoring.sln

      - name: Build
        run: dotnet build VkoInternetMonitoring.sln --configuration Release --no-restore

      - name: Test .NET
        run: dotnet test VkoInternetMonitoring.sln --configuration Release --no-build

      - name: Test web models
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests/web/*.test.mjs | ForEach-Object FullName
          node --test $tests

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($script.Name): $_" }
            }
          }
          if ($failed) { exit 1 }
