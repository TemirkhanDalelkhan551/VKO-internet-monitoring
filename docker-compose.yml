services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vko_monitoring
      POSTGRES_USER: vko_monitoring
      POSTGRES_PASSWORD: vko_dev_password
    ports:
      - "55432:5432"
    volumes:
      - vko-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vko_monitoring -d vko_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vko-postgres-data:
